# This is the basic template that new users should use to develop the local.properties file.
# For the provided variables you should modify the values in <> for your specific directory 
# directory structure, username and password
#
# This file should be copied and then modified as not to accidently check in this file with
# sensitive information.

sdk.dir=<directory path to the Android sdk>

# The ATAK SDK of each ATAK version the plugin is built for (-PatakVersion=5.6.0 or 5.8.0, the
# default). Don't set sdk.path: the build sets it from these. See docs/07.
atak.sdk.5.6=<directory of the ATAK 5.6 SDK>
atak.sdk.5.8=<directory of the ATAK 5.8 SDK>

# tak.gov's Maven repository instead of the offline SDKs
#takrepo.url=https://artifacts.tak.gov/artifactory/maven
#takrepo.user=<username>
#takrepo.password=<password>


# when building plugins you can manually set the version code so that it is easier to bisect 
# code, just set the takStaticVersion

#takStaticVersion=1001

