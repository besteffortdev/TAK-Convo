# TAK Convo's pipeline: the style checks and the user manual, then for each ATAK version a
# debug and a release build, the JVM tests and the link check against that version's
# developer ATAK. See docs/07-development-and-testing.md.
#
# The runner needs the ATAK SDKs, which aren't public (tak.gov): the CI/CD variables
# ATAK_SDK_58 and ATAK_SDK_56 name their directories as the jobs see them, for example a
# volume the Docker runner mounts read-only (config.toml: volumes = ["/opt/atak-sdk:/opt/atak-sdk:ro"],
# ATAK_SDK_58 = /opt/atak-sdk/ATAK-CAN-5.8.0.5-SDK).

stages:
  - check
  - build

style:
  stage: check
  image: alpine:3.22
  script:
    - apk add --no-cache bash grep
    - bash tools/check-style.sh

# what TAK.gov's pipeline builds into the APK (gradle/typst.gradle), with the same Typst
manual:
  stage: check
  image: alpine:3.22
  script:
    - apk add --no-cache curl tar xz
    - curl -sSfL https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
      | tar -xJ -C /tmp
    - /tmp/typst-x86_64-unknown-linux-musl/typst compile --font-path docs/user_manual/fonts
      docs/user_manual/usermanual.typ usermanual.pdf
  artifacts:
    paths:
      - usermanual.pdf
    expire_in: 2 weeks

build:
  stage: build
  image: eclipse-temurin:17-jdk
  parallel:
    matrix:
      - ATAK_VERSION: ["5.8.0", "5.6.0"]
  variables:
    ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
    # https://developer.android.com/studio, "Command line tools only"
    CMDLINE_TOOLS: commandlinetools-linux-15859902_latest.zip
  cache:
    key: android-sdk-gradle
    paths:
      - .android-sdk/
      - .gradle-home/caches/
      - .gradle-home/wrapper/
  before_script:
    - MINOR=$(echo "$ATAK_VERSION" | cut -d. -f1,2)
    - SDK=$(eval echo "\$ATAK_SDK_$(echo "$MINOR" | tr -d .)")
    - |
      if [ ! -f "$SDK/main.jar" ] || [ ! -f "$SDK/atak.apk" ]; then
        echo "ATAK_SDK_$(echo "$MINOR" | tr -d .) must name the ATAK $MINOR SDK directory (docs/07)"
        exit 1
      fi
    - apt-get update -qq && apt-get install -y -qq curl unzip > /dev/null
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -sSfo /tmp/tools.zip "https://dl.google.com/android/repository/$CMDLINE_TOOLS"
        unzip -q /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
    - '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null'
  script:
    - chmod +x gradlew
    - ./gradlew --no-daemon "-PatakVersion=$ATAK_VERSION" "-Patak.sdk.$MINOR=$SDK"
      assembleCivDebug assembleCivRelease testCivDebugUnitTest
    - java -Xmx4g tools/AtakLinkCheck.java "$SDK/atak.apk"
      app/build/outputs/apk/civ/debug/*-$ATAK_VERSION-civ-debug.apk
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - app/build/outputs/apk/
      - app/build/reports/tests/
    reports:
      junit: app/build/test-results/testCivDebugUnitTest/*.xml
