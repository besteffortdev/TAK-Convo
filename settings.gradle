plugins {
    // downloads the JDK 21 toolchain when the machine has none (build.gradle)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'takconvo'
include ':app'

// Fork of Conversations 2.20.4 (GPLv3), built as an Android library and embedded in the plugin
include ':conversations'
include ':conversations-annotation'
project(':conversations-annotation').projectDir = file('conversations/libs/annotation')
include ':conversations-annotation-processor'
project(':conversations-annotation-processor').projectDir = file('conversations/libs/annotation-processor')
